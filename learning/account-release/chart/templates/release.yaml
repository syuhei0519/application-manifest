{{- if or (ne .Release.Namespace "learning-account-release") (ne .Release.Name "account-release") -}}
{{- fail "dedicated Account release target required" -}}
{{- end -}}
{{- $digest := index (splitList "@sha256:" .Values.image) 1 -}}
{{- if ne .Values.imageRevision (printf "sha256-%s" (substr 0 56 $digest)) -}}
{{- fail "imageRevision must match immutable image digest" -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: account-release
  namespace: {{ .Release.Namespace }}
  labels: {learning.local/owner: {{ .Values.owner | quote }}}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  selector:
    matchLabels: {app: account-release}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      {{- if eq .Values.strategy "Canary" }}
      trafficRouting:
        istio:
          virtualService: {name: account-release, routes: [primary]}
          destinationRule: {name: account-release, stableSubsetName: stable, canarySubsetName: canary}
      steps:
        {{- range $weight := list 10 50 100 }}
        - setWeight: {{ $weight }}
        {{- if $.Values.analysisPluginEnabled }}
        - analysis:
            templates: [{templateName: account-release-policy}]
            args:
              - {name: stable-hash, valueFrom: {podTemplateHashValue: Stable}}
              - {name: candidate-hash, valueFrom: {podTemplateHashValue: Latest}}
              - {name: stage, value: {{ $weight | quote }}}
        {{- end }}
        {{- if eq $.Values.promotionMode "manual" }}
        - pause: {}
        {{- end }}
        {{- end }}
      {{- end }}
  template:
    metadata:
      labels:
        app: account-release
        version: {{ .Values.imageRevision | quote }}
        learning.local/service: account
        learning.local/owner: {{ .Values.owner | quote }}
        istio.io/rev: learning-1-31-2
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
        learning.local/source-commit: {{ .Values.sourceCommit | quote }}
        learning.local/image: {{ .Values.image | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          env:
            - {name: PGHOST, value: learning-account-db}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: account}
            - {name: PGUSER, value: account_app}
            - {name: PGSSLMODE, value: disable}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: learning-account-db, key: app-password}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://account-release-otel-collector.observability.svc.cluster.local:4318"}
            - {name: DEPLOYMENT_ENVIRONMENT, value: local}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: account-release
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: account-release}
  ports: [{name: http, port: 8080, targetPort: http, appProtocol: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: account-release-metrics
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector: {app: account-release}
  ports: [{name: metrics, port: 15090, targetPort: 15090}]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: account-release
  namespace: {{ .Release.Namespace }}
  # Remove subset routing before detaching the old Istio controller integration.
  annotations: {argocd.argoproj.io/sync-wave: {{ ternary "0" "-1" (eq .Values.strategy "Canary") | quote }}}
spec:
  hosts: [account-release.learning-account-release.svc.cluster.local]
  exportTo: ["."]
  gateways: [mesh]
  http:
    - name: primary
      match:
        - uri: {exact: /api/accounts}
        - uri: {prefix: /api/accounts/}
      retries: {attempts: 0}
      route:
        {{- if eq .Values.strategy "Canary" }}
        - destination: {host: account-release.learning-account-release.svc.cluster.local, subset: stable, port: {number: 8080}}
          weight: 100
        - destination: {host: account-release.learning-account-release.svc.cluster.local, subset: canary, port: {number: 8080}}
          weight: 0
        {{- else }}
        - destination: {host: account-release.learning-account-release.svc.cluster.local, port: {number: 8080}}
          weight: 100
        {{- end }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: account-release
  namespace: {{ .Release.Namespace }}
  # Rolling's full route is installed before subsets are removed. A later
  # controller cleanup cannot reintroduce subsets. Only a separately verified
  # Rolling seed phase creates them again after Istio ownership is released.
  # Canary needs its subsets before the Rollout can start, including initial sync.
  annotations: {argocd.argoproj.io/sync-wave: {{ ternary "-1" "1" (eq .Values.strategy "Canary") | quote }}}
spec:
  host: account-release.learning-account-release.svc.cluster.local
  exportTo: ["."]
  {{- if or (eq .Values.strategy "Canary") .Values.bootstrapHash }}
  subsets:
    - name: stable
      labels: {app: account-release, rollouts-pod-template-hash: {{ default "unassigned" .Values.bootstrapHash | quote }}}
    - name: canary
      labels: {app: account-release, rollouts-pod-template-hash: {{ default "unassigned" .Values.bootstrapHash | quote }}}
  {{- else }}
  subsets: []
  {{- end }}
