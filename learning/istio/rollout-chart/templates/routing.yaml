apiVersion: v1
kind: Service
metadata:
  name: mesh-rollout
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app: mesh-rollout}
  ports: [{name: http, port: 8080, targetPort: http, appProtocol: http}]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mesh-rollout
  namespace: {{ .Release.Namespace }}
spec:
  host: mesh-rollout.learning-istio-demo.svc.cluster.local
  exportTo: ["."]
  subsets:
    - name: stable
      labels: {app: mesh-rollout}
    - name: canary
      labels: {app: mesh-rollout}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mesh-rollout
  namespace: {{ .Release.Namespace }}
spec:
  hosts: [mesh-rollout.learning-istio-demo.svc.cluster.local]
  exportTo: ["."]
  gateways: [mesh]
  http:
    - name: demo-only
      match:
        - method: {exact: GET}
          uri: {exact: /version}
      retries: {attempts: 0}
      route:
        - destination:
            host: mesh-rollout.learning-istio-demo.svc.cluster.local
            subset: stable
            port: {number: 8080}
          weight: 100
        - destination:
            host: mesh-rollout.learning-istio-demo.svc.cluster.local
            subset: canary
            port: {number: 8080}
          weight: 0
