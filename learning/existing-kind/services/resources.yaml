apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-account-init
  namespace: learning-services-20261018
  labels:
    app.kubernetes.io/part-of: learning-only
    learning.local/owner: codex-local-learning
    learning.local/service: account
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  10-app.sh: '#!/bin/sh

    set -eu

    app_password="$(cat /run/db/app-password)"

    psql --set=ON_ERROR_STOP=1 --set=app_password="$app_password" <<''SQL''

    SELECT format(''CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT
    PASSWORD %L'', ''account_app'', :''app_password'') \gexec

    SELECT format(''CREATE DATABASE %I OWNER %I'', ''account'', ''account_app'') \gexec

    SQL

    '
