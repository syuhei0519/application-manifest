{{/* 学習用 API の更新前に専用 DB の構造を揃える Job を出力します。 */}}apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "learning.name" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "learning.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        {{- include "learning.labels" . | nindent 8 }}
      annotations:
        {{- include "learning.annotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ include "learning.image" . | quote }}
          imagePullPolicy: Never
          args: [migrate]
          env:
            {{- include "learning.env" . | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
