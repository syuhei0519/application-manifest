{{- if or (gt (len .Release.Namespace) 63) (not (regexMatch "^learning-[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Release.Namespace)) -}}
{{- fail "explicit dedicated learning-* namespace required" -}}
{{- end -}}
