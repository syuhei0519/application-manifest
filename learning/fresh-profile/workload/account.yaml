apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-database
  namespace: fresh-account
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-migration
  namespace: fresh-account
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-runtime
  namespace: fresh-account
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: account-postgresql
  namespace: fresh-account
spec:
  selector:
    app.kubernetes.io/name: account-postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: account-data
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: account-postgresql
  namespace: fresh-account
spec:
  serviceName: account-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-postgresql
    spec:
      serviceAccountName: account-database
      automountServiceAccountToken: false
      containers:
      - name: postgresql
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
        - name: POSTGRES_DB
          value: account
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: account-db-bootstrap, key: admin-password}
        ports:
        - {name: postgresql, containerPort: 5432}
        readinessProbe:
          exec: {command: [pg_isready, -U, postgres, -d, account]}
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: account-data}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: account-db-role-bootstrap
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: account-migration
      automountServiceAccountToken: false
      containers:
      - name: role-bootstrap
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        command: [sh, -ceu]
        args:
        - >-
          psql -h account-postgresql -U postgres -d account
          --set=migration_role="$MIGRATION_USERNAME"
          --set=migration_password="$MIGRATION_PASSWORD"
          --set=runtime_role="$RUNTIME_USERNAME"
          --set=runtime_password="$RUNTIME_PASSWORD"
          --set=database_name=account
          --set=service_schema=account
          --file=/contract/bootstrap.sql
        env:
        - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: account-db-bootstrap, key: admin-password}}}
        - {name: MIGRATION_USERNAME, valueFrom: {secretKeyRef: {name: account-db-migration, key: username}}}
        - {name: MIGRATION_PASSWORD, valueFrom: {secretKeyRef: {name: account-db-migration, key: password}}}
        - {name: RUNTIME_USERNAME, valueFrom: {secretKeyRef: {name: account-db-runtime, key: username}}}
        - {name: RUNTIME_PASSWORD, valueFrom: {secretKeyRef: {name: account-db-runtime, key: password}}}
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - {name: contract, mountPath: /contract, readOnly: true}
      volumes:
      - {name: contract, configMap: {name: account-role-bootstrap}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: account-migration
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # 190s history wait + 30s grants + two 5s kill graces + 30s startup/exit margin.
  # The retained Account migrator keeps its own unchanged 170s processing limit.
  activeDeadlineSeconds: 260
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: account-migration
      automountServiceAccountToken: false
      containers:
      - name: migrate
        image: ghcr.io/syuhei0519/backend-app@sha256:746e9acb5e5a24dcd6644ab5e082f2d3dad79620ec2e00afa80aa39a7436cf9a
        args: [migrate]
        env:
        - {name: ACCOUNT_RUNTIME_PROFILE, value: fresh-account}
        - {name: PGHOST, value: account-postgresql.fresh-account.svc}
        - {name: PGPORT, value: "5432"}
        - {name: PGDATABASE, value: account}
        - {name: PGUSER, valueFrom: {secretKeyRef: {name: account-db-migration, key: username}}}
        - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: account-db-migration, key: password}}}
        - {name: PGSSLMODE, value: disable}
        - {name: DEPLOYMENT_ENVIRONMENT, value: local}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_UID
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.name=account-migration,deployment.environment=local,platform.profile=$(ACCOUNT_RUNTIME_PROFILE),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID)"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.fresh-observability.svc.cluster.local:4318}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
      # Both regular containers must succeed before the Job is Complete.
      # Wait for the retained migrator's committed history, then grant as owner.
      - name: runtime-grants
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        command: [sh, -ceu]
        args:
        - |
          # Bound wall time, including slow connections/queries, not just sleeps.
          timeout --kill-after=5s 190s sh -ceu '
            until [ "$(psql -X -Atqc "SELECT count(*) = 1 AND min(version) = 1 FROM account.schema_migrations" 2>/dev/null)" = t ]; do
              sleep 2
            done
          ' || { echo 'migration history wait expired or failed' >&2; exit 1; }
          # Separate budget covers connection, advisory-lock handoff and SQL.
          exec timeout --kill-after=5s 30s psql -X --set=ON_ERROR_STOP=1 --set=grant_runtime=1 --file=/contract/bootstrap.sql
        env:
        - {name: PGHOST, value: account-postgresql.fresh-account.svc}
        - {name: PGPORT, value: "5432"}
        - {name: PGDATABASE, value: account}
        - {name: PGUSER, valueFrom: {secretKeyRef: {name: account-db-migration, key: username}}}
        - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: account-db-migration, key: password}}}
        - {name: PGSSLMODE, value: disable}
        - {name: PGCONNECT_TIMEOUT, value: "2"}
        - {name: PGOPTIONS, value: "-c statement_timeout=2000"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {memory: 64Mi}
        volumeMounts:
        - {name: contract, mountPath: /contract, readOnly: true}
      volumes:
      - {name: contract, configMap: {name: account-role-bootstrap}}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: account-api
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      trafficRouting:
        istio:
          virtualService: {name: account-api, routes: [primary]}
          destinationRule: {name: account-api, stableSubsetName: stable, canarySubsetName: canary}
      # Plugin and controller artifact must be installed and pinned before sync.
      steps:
      - {setWeight: 10}
      - analysis:
          templates: [{templateName: account-api-policy}]
          args:
          - {name: stable-hash, valueFrom: {podTemplateHashValue: Stable}}
          - {name: candidate-hash, valueFrom: {podTemplateHashValue: Latest}}
          - {name: stage, value: "10"}
      - {pause: {}}
      - {setWeight: 50}
      - analysis:
          templates: [{templateName: account-api-policy}]
          args:
          - {name: stable-hash, valueFrom: {podTemplateHashValue: Stable}}
          - {name: candidate-hash, valueFrom: {podTemplateHashValue: Latest}}
          - {name: stage, value: "50"}
      - {pause: {}}
      - {setWeight: 100}
      - analysis:
          templates: [{templateName: account-api-policy}]
          args:
          - {name: stable-hash, valueFrom: {podTemplateHashValue: Stable}}
          - {name: candidate-hash, valueFrom: {podTemplateHashValue: Latest}}
          - {name: stage, value: "100"}
      - {pause: {}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-api
    spec:
      serviceAccountName: account-runtime
      automountServiceAccountToken: false
      containers:
      - name: api
        image: ghcr.io/syuhei0519/backend-app@sha256:746e9acb5e5a24dcd6644ab5e082f2d3dad79620ec2e00afa80aa39a7436cf9a
        env:
        - {name: ACCOUNT_RUNTIME_PROFILE, value: fresh-account}
        - {name: PGHOST, value: account-postgresql.fresh-account.svc}
        - {name: PGPORT, value: "5432"}
        - {name: PGDATABASE, value: account}
        - {name: PGUSER, valueFrom: {secretKeyRef: {name: account-db-runtime, key: username}}}
        - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: account-db-runtime, key: password}}}
        - {name: PGSSLMODE, value: disable}
        - {name: DEPLOYMENT_ENVIRONMENT, value: local}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: POD_UID
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.name=account-api,deployment.environment=local,platform.profile=$(ACCOUNT_RUNTIME_PROFILE),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID)"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.fresh-observability.svc.cluster.local:4318}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  selector:
    app.kubernetes.io/name: account-api
  ports:
  - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  host: account-api.fresh-account.svc.cluster.local
  subsets:
  - name: stable
    labels: {app.kubernetes.io/name: account-api, rollouts-pod-template-hash: unassigned}
  - name: canary
    labels: {app.kubernetes.io/name: account-api, rollouts-pod-template-hash: unassigned}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  hosts: [account-api.fresh-account.svc.cluster.local]
  gateways: [mesh]
  http:
  - name: primary
    route:
    - destination: {host: account-api.fresh-account.svc.cluster.local, subset: stable, port: {number: 8080}}
      weight: 100
    - destination: {host: account-api.fresh-account.svc.cluster.local, subset: canary, port: {number: 8080}}
      weight: 0

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: account-api-policy
  namespace: fresh-account
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  args:
  - {name: stable-hash}
  - {name: candidate-hash}
  - {name: stage}
  metrics:
  - name: account-policy
    initialDelay: 300s
    count: 1
    failureLimit: 0
    inconclusiveLimit: 0
    consecutiveErrorLimit: 0
    provider:
      plugin:
        learning-local/account-policy:
          stableHash: "{{args.stable-hash}}"
          candidateHash: "{{args.candidate-hash}}"
          stage: "{{args.stage}}"
