apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fresh-account-release
  namespace: fresh-control
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: fresh-workload
  source:
    repoURL: https://github.com/syuhei0519/application-manifest.git
    targetRevision: __APPLICATION_MANIFEST_SHA__
    path: learning/fresh-profile/workload
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: fresh-account
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - Prune=false
