---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-database
  namespace: fresh-account
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-migration
  namespace: fresh-account
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: account-runtime
  namespace: fresh-account
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: account-postgresql
  namespace: fresh-account
spec:
  selector:
    app.kubernetes.io/name: account-postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: account-data
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: account-postgresql
  namespace: fresh-account
spec:
  serviceName: account-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-postgresql
    spec:
      serviceAccountName: account-database
      automountServiceAccountToken: false
      containers:
      - name: postgresql
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
        - name: POSTGRES_DB
          value: account
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: account-db-bootstrap
              key: admin-password
        ports:
        - name: postgresql
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - account
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: account-data
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '10'
  name: account-db-role-bootstrap
  namespace: fresh-account
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - psql -h account-postgresql -U postgres -d account --set=migration_role="$MIGRATION_USERNAME"
          --set=migration_password="$MIGRATION_PASSWORD" --set=runtime_role="$RUNTIME_USERNAME"
          --set=runtime_password="$RUNTIME_PASSWORD" --set=database_name=account --set=service_schema=account
          --file=/contract/bootstrap.sql
        command:
        - sh
        - -ceu
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: account-db-bootstrap
        - name: MIGRATION_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: account-db-migration
        - name: MIGRATION_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: account-db-migration
        - name: RUNTIME_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: account-db-runtime
        - name: RUNTIME_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: account-db-runtime
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        name: role-bootstrap
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /contract
          name: contract
          readOnly: true
      restartPolicy: Never
      serviceAccountName: account-migration
      volumes:
      - configMap:
          name: account-role-bootstrap
        name: contract
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: '20'
  name: account-migration
  namespace: fresh-account
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - migrate
        env:
        - name: ACCOUNT_RUNTIME_PROFILE
          value: fresh-account
        - name: PGHOST
          value: account-postgresql.fresh-account.svc
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: account
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              key: username
              name: account-db-migration
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: account-db-migration
        - name: PGSSLMODE
          value: disable
        - name: DEPLOYMENT_ENVIRONMENT
          value: local
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=account-migration,deployment.environment=local,platform.profile=$(ACCOUNT_RUNTIME_PROFILE),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.fresh-observability.svc.cluster.local:4318
        image: ghcr.io/syuhei0519/backend-app@sha256:746e9acb5e5a24dcd6644ab5e082f2d3dad79620ec2e00afa80aa39a7436cf9a
        name: migrate
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 10001
          runAsNonRoot: true
          runAsUser: 10001
      restartPolicy: Never
      serviceAccountName: account-migration
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: account-api
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      trafficRouting:
        istio:
          virtualService:
            name: account-api
            routes:
            - primary
          destinationRule:
            name: account-api
            stableSubsetName: stable
            canarySubsetName: canary
      steps:
      - setWeight: 10
      - analysis:
          templates:
          - templateName: account-api-policy
          args:
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stage
            value: '10'
      - pause: {}
      - setWeight: 50
      - analysis:
          templates:
          - templateName: account-api-policy
          args:
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stage
            value: '50'
      - pause: {}
      - setWeight: 100
      - analysis:
          templates:
          - templateName: account-api-policy
          args:
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: candidate-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stage
            value: '100'
      - pause: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-api
    spec:
      serviceAccountName: account-runtime
      automountServiceAccountToken: false
      containers:
      - name: api
        image: ghcr.io/syuhei0519/backend-app@sha256:746e9acb5e5a24dcd6644ab5e082f2d3dad79620ec2e00afa80aa39a7436cf9a
        env:
        - name: ACCOUNT_RUNTIME_PROFILE
          value: fresh-account
        - name: PGHOST
          value: account-postgresql.fresh-account.svc
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: account
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: account-db-runtime
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: account-db-runtime
              key: password
        - name: PGSSLMODE
          value: disable
        - name: DEPLOYMENT_ENVIRONMENT
          value: local
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=account-api,deployment.environment=local,platform.profile=$(ACCOUNT_RUNTIME_PROFILE),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.fresh-observability.svc.cluster.local:4318
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  selector:
    app.kubernetes.io/name: account-api
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  host: account-api.fresh-account.svc.cluster.local
  subsets:
  - name: stable
    labels:
      app.kubernetes.io/name: account-api
      rollouts-pod-template-hash: unassigned
  - name: canary
    labels:
      app.kubernetes.io/name: account-api
      rollouts-pod-template-hash: unassigned
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: account-api
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  hosts:
  - account-api.fresh-account.svc.cluster.local
  gateways:
  - mesh
  http:
  - name: primary
    route:
    - destination:
        host: account-api.fresh-account.svc.cluster.local
        subset: stable
        port:
          number: 8080
      weight: 100
    - destination:
        host: account-api.fresh-account.svc.cluster.local
        subset: canary
        port:
          number: 8080
      weight: 0
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: account-api-policy
  namespace: fresh-account
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  args:
  - name: stable-hash
  - name: candidate-hash
  - name: stage
  metrics:
  - name: account-policy
    initialDelay: 300s
    count: 1
    failureLimit: 0
    inconclusiveLimit: 0
    consecutiveErrorLimit: 0
    provider:
      plugin:
        learning-local/account-policy:
          stableHash: '{{args.stable-hash}}'
          candidateHash: '{{args.candidate-hash}}'
          stage: '{{args.stage}}'
