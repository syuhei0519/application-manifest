# backend Chartの既定値。environments/local/backend.yamlを上書きに使う。
# 実際に反映される項目はtemplatesの.Values参照で決まる。
# replicaCount は Deployment の replicas へ反映し、schema が軽量 profile の上限を制限する。
replicaCount: 1
image: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
imagePullSecrets: [{name: registry-backend-pull}]
release: {sourceCommit: ""}
serviceAccount: {name: backend, automountServiceAccountToken: false}
service: {type: ClusterIP, port: 8080}
config: {dbHost: postgresql, dbPort: 5432, dbName: account, sslmode: disable, logLevel: info}
secrets: {existingSecret: account-db, usernameKey: app-username, passwordKey: app-password}
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
podSecurityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
# probes は Deployment の PodTemplate へ反映し、変更時は新しい ReplicaSet を生成する。
probes:
  startup: {path: /livez, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 30}
  liveness: {path: /livez, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
  readiness: {path: /readyz, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 2}
# activeDeadlineSeconds/backoffLimit は migration Job へ反映する。未対応値は schema で拒否する。
migration: {activeDeadlineSeconds: 180, backoffLimit: 1}
restartNonce: ""
telemetry: {enabled: false, endpoint: "http://otel-collector.observability.svc.cluster.local:4318", environment: local}
