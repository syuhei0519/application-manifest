{{/*
backend ApplicationのSync hook。/server migrateをDeploymentと同じ検査済みimageで実行する。
backend-app/internal/store/postgres/migrate.goがDB移行と排他/履歴を担当する。
*/}}apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  annotations:
{{/*
同じApplication内でConfigMap/SA wave -20→migration wave -10→Deployment wave 0。
失敗hookは後続を止め、成功hookは削除。BeforeHookCreationで再Sync時に旧同名Jobを置換する。
*/}}    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
{{/*
valuesのdeadline180秒/backoff1を使う。Go側全体170秒との間にcleanup余裕10秒を残す。
失敗Jobを診断し、DB修復後はApplication全体を明示Syncする運用。自動retryやselective syncを成功保証にしない。
*/}}  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "backend.labels" . | nindent 8 }}
      annotations:
        {{- include "backend.releaseAnnotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "backend.env" . | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes: [{name: tmp, emptyDir: {}}]
