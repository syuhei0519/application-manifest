{{/*
backend用ServiceAccount生成。Deploymentが参照し、アプリに不要なAPI token自動mountを無効化する。
image取得資格情報はPodのimagePullSecretsでkubeletが使用する。
*/}}apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
automountServiceAccountToken: false
