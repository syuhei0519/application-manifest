{{/*
空のPGDATAを初期化するentrypoint用script。StatefulSetが/docker-entrypoint-initdb.dへmountする。
app role/DBを作るがaccounts/schema_migrationsはbackend migration Jobが作る。
SQL識別子%I/値%Lをformatで引用。既存PVCのpassword変更・DB restoreをこのscriptの再実行で済ませない。
*/}}apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  10-account.sh: |
    #!/bin/sh
    set -eu
    app_user="$(cat /run/account-db/app-username)"
    app_password="$(cat /run/account-db/app-password)"
    psql --set=ON_ERROR_STOP=1 --set=app_user="$app_user" --set=app_password="$app_password" --set=db_name="{{ .Values.config.dbName }}" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L', :'app_user', :'app_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'app_user')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name') \gexec
    SQL
