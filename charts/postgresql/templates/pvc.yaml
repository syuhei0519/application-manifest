{{/*
DBデータの永続volume要求。StatefulSetのdata volumeがpostgresql-dataを参照する。
Prune=false/Delete=falseでArgoによる削除を避ける。直接の管理者削除・storage障害を防ぐ機構ではなくbackupも別途必要。
*/}}apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  accessModes: {{ toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests: {storage: {{ .Values.persistence.size }}}
