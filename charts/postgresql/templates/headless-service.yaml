{{/*
StatefulSetの安定した接続先を提供するheadless Service。
呼出元はcharts/postgresql、接続設定はcharts/backend/templates/_helpers.tpl。
*/}}apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: postgresql, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: postgresql, port: 5432, targetPort: postgresql}]
