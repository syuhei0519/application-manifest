{{/*
frontend Podへ内部HTTPを転送するClusterIP Service。selectorとDeploymentのlabelを対応させる。
Ready Podのendpointを使い、Pod置換でIPが変わっても同じService名で呼べる。
*/}}apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
