{{/*
frontend用ServiceAccount生成。Deploymentが参照し、アプリに不要なAPI token自動mountを無効化する。
image取得資格情報はPodのimagePullSecretsでkubeletが使用する。
*/}}apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
