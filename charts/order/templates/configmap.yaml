{{/* Order API と migrationの描画で、秘密ではない実行時設定を ConfigMap として出力します。 */}}{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
  labels:
    {{- include "order.labels" . | nindent 4 }}
data:
  db-host: {{ .Values.config.dbHost | quote }}
  db-port: {{ .Values.config.dbPort | quote }}
  db-name: {{ .Values.config.dbName | quote }}
  sslmode: {{ .Values.config.sslmode | quote }}
  log-level: {{ .Values.config.logLevel | quote }}
{{- end }}
