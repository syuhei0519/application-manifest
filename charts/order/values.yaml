# Order API と migrationを描画する既定値です。環境別の値は呼び出し側から上書きします。
# Disabled preparation only. No published Order image has been selected.
enabled: false
replicaCount: 1
image:
  repository: ghcr.io/syuhei0519/backend-app-order
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
release:
  schemaVersion: github-v2
  service: order
  sourceRepository: syuhei0519/backend-app
  sourceCommit: ''
  runId: ''
  runAttempt: ''
  recordUrl: ''
  recordSha256: ''
  sbomUrl: ''
  sbomSha256: ''
serviceAccount:
  name: order
  automountServiceAccountToken: false
service:
  type: ClusterIP
  port: 8080
config:
  dbHost: order-postgresql
  dbPort: 5432
  dbName: orders
  sslmode: disable
  logLevel: info
secrets:
  existingSecret: order-db
  usernameKey: app-username
  passwordKey: app-password
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
probes:
  startup:
    path: /livez
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /livez
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
migration:
  activeDeadlineSeconds: 180
  backoffLimit: 1
