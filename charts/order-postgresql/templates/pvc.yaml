{{/* Order 専用 PostgreSQLの描画で、DB のデータを Pod の再作成後も保持するための領域を要求します。 */}}{{- if .Values.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-postgresql-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    {{- include "order-postgresql.labels" . | nindent 4 }}
spec:
  accessModes: {{ toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests: {storage: {{ .Values.persistence.size }}}
{{- end }}
