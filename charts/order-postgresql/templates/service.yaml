{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: order-postgresql
  labels:
    {{- include "order-postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: order-postgresql, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: postgresql, port: 5432, targetPort: postgresql}]
{{- end }}
