name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: python3 -I ci/github/classify.py
  docs:
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Documentation and secret checks
        env:
          DOCS_BASE: ${{ needs.classify.outputs.base }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
            -e DOCS_BASE="$DOCS_BASE" \
            --entrypoint sh aquasec/trivy:0.75.0@sha256:9db099105405c648166e6b94155eb32f8da12673cf1f455207f7385cc9a77283 -ec 'git config --global --add safe.directory /work; sh ci/docs-check.sh'
  validate:
    needs: classify
    if: needs.classify.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - uses: syuhei0519/backend-app/.github/actions/shared-tools@ba8b3d211ac3e497900abd6c6f44f45388e3801c # main
        with:
          modules: scan-gate
      - name: Policy and boundary tests
        run: bash ci/github/test.sh
      - name: Account release safety contract
        run: python3 -m unittest discover -s learning/account-release -p 'test_contract.py' -v
      - name: Render, policy and checksum checks
        run: |
          mkdir -p .security/public
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work --entrypoint sh alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 -ec "sh ci/validate.sh; .security/scan-gate -check-render-only .rendered -out .security/public/pre-render.json; (cd tools/checksum; ../../.build/checksum-test -test.v)"
      - name: Learning Account canary static checks
        run: |
          python3 -m venv .build/canary-venv
          .build/canary-venv/bin/python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          docker run --rm --entrypoint cat alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 /usr/bin/helm > .build/helm
          chmod +x .build/helm
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python -m unittest discover -s learning/account-release -p 'test_integration.py' -v
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python -m unittest discover -s learning/account-release -p 'test_release_modes.py' -v
          go -C learning/account-release/metric-plugin test -count=1 -timeout 90s -v ./...
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/validate.py
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/canary/validate.py --output .rendered/account-canary
          PATH="$PWD/.build:$PATH" go -C learning/canary/analysis-test test -timeout 90s -v ./...
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 -skip Rollout,AnalysisTemplate .rendered/account-canary
      - name: Checkout fixed Istio learning source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: syuhei0519/platform-gitops
          ref: efd3a1f5a31eaf904bc787456034e4cebe932f7f
          path: .build/platform-istio
          persist-credentials: false
      - name: Checkout Account integration platform source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: syuhei0519/platform-gitops
          ref: 867cb81f071d06f7521b93aa110ae001200142a4
          path: .build/platform-account
          persist-credentials: false
      - name: Account integration proposal and upstream schemas
        run: |
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/account-release/bootstrap_proposal.py --platform .build/platform-account --cache .build/account-release-cache --output .build/account-release-proposal
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/account-release/validate_upstream.py --platform .build/platform-account --proposal .build/account-release-proposal --output .rendered/account-release
          docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint /bin/promtool quay.io/prometheus/prometheus:v3.15.0@sha256:86b17a25c2db1d16a61b16b3c8f336679eb19e26333d03e808da387206e40faa check rules .rendered/account-release/queries.yaml
          docker run --rm -v "$PWD:/work:ro" -w /work --entrypoint /bin/promtool quay.io/prometheus/prometheus:v3.15.0@sha256:86b17a25c2db1d16a61b16b3c8f336679eb19e26333d03e808da387206e40faa test rules .rendered/account-release/conservation-tests.yaml
      - name: Checkout fixed Rollouts schema source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: argoproj/argo-rollouts
          ref: 356117c8e9a21b74b58c2c01d640aa91994522b5
          path: .build/rollouts-istio
          persist-credentials: false
      - name: Checkout fixed Argo CD sync implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: argoproj/argo-cd
          ref: e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
          path: .build/argocd-istio
          persist-credentials: false
      - name: Istio routing static and observation contracts
        run: |
          curl --fail --location --silent --show-error https://github.com/istio/istio/releases/download/1.31.2/istio-1.31.2-linux-amd64.tar.gz -o .build/istio.tar.gz
          echo 'b3d58081fcffab9456f16b18e990d4dff8fc08b075259bbc0e82b512337a3575  .build/istio.tar.gz' | sha256sum -c -
          tar -xzf .build/istio.tar.gz -C .build istio-1.31.2/bin/istioctl
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/istio/validate.py --platform .build/platform-istio --istioctl .build/istio-1.31.2/bin/istioctl --output .rendered/istio-routing
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/istio/validate_rollout.py --platform .build/platform-istio --rollouts .build/rollouts-istio --istioctl .build/istio-1.31.2/bin/istioctl --output .rendered/istio-routing/rollout
          .build/canary-venv/bin/python -m unittest discover -s learning/istio/tests -v
          PATH="$PWD/.build:$PATH" .build/canary-venv/bin/python learning/istio/check_argocd_sync.py --argocd .build/argocd-istio
      - name: Kubernetes schema checks
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 .rendered/all.yaml
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 -skip VirtualService,DestinationRule,Rollout,Application,AppProject .rendered/istio-routing
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 -skip VirtualService,DestinationRule,Rollout .rendered/account-release/stable.yaml .rendered/account-release/candidate.yaml
          docker run --rm -v "$PWD:/work:ro" -w /work ghcr.io/yannh/kubeconform:v0.7.0-alpine@sha256:8f0eeaaa96ba27ba1500b0e4b1c215acc358d159c62a7ecae58d7a03403287b0 -strict -summary -kubernetes-version 1.36.0 learning/account-release/database.yaml
      - name: Source and rendered security checks
        env:
          SECURITY_RENDER_REQUIRED: 'true'
        run: bash ci/github/source-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-results-${{ github.run_attempt }}
          path: .security/public/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: account-analysis-render-${{ github.run_attempt }}
          path: .rendered/account-canary/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: account-release-static-${{ github.run_attempt }}
          path: |
            .rendered/account-release/
            .build/account-release-proposal/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: istio-routing-render-${{ github.run_attempt }}
          path: .rendered/istio-routing/
          retention-days: 30
  ci-result:
    if: always()
    needs: [classify, docs, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required check
        env:
          DOCS: ${{ needs.classify.outputs.docs }}
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: |
          test "$CLASSIFY" = success
          if test "$DOCS" = true; then test "$DOCS_RESULT" = success; else
            test "$VALIDATE" = success
          fi
